name: Deploiement Automatique Alwaysdata

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Recuperer le code du dépôt GitHub
      uses: actions/checkout@v4

    - name: Transférer les fichiers via SFTP (SSH)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ALWAYSDATA_HOST }}
        username: ${{ secrets.ALWAYSDATA_USER }}
        password: ${{ secrets.ALWAYSDATA_PASSWORD }}
        port: 22
        source: "./*"
        target: "/home/nadutil/www/"
